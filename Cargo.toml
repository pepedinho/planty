[package]
name = "planty"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler",  "println"] }
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
nb = "1.1.0"
embedded-hal = "1.0"
esp-alloc = "0.9.0"

esp-radio = { version = "0.17.0", features = ["esp32", "wifi"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "embassy", "esp-radio"] }

esp-storage = { version = "0.8.1", features = ["esp32"] }
embedded-storage = "0.3"

embassy-net = { version = "0.6.0", features = ["tcp", "dhcpv4"] }
embassy-time = "0.4.0"
embassy-executor = "0.9.0"
embassy-futures = "0.1"
embedded-io-async = "0.6"

[profile.dev]
debug = false
opt-level = "s"
codegen-units = 1

[profile.dev.package."*"]
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
opt-level = "s"
