[package]
name = "planty"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler",  "println"] }
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal-smartled = "0.17.0" 
nb = "1.1.0"

embedded-hal = "1.0"

ssd1306 = "0.10.0"
embedded-graphics = "0.8"

[profile.dev]
debug = false
opt-level = "s"
codegen-units = 1

[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"

